services:
  postgres:
    image: postgres:16
    container_name: finsight_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight_password
      POSTGRES_DB: finsight_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: finsight_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: