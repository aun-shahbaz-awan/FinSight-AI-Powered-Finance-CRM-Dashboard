services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finsight_network

  redis:
    image: redis:7
    restart: always
    networks:
      - finsight_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/apps/api/uploads
    networks:
      - finsight_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    env_file:
      - .env.production
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - finsight_network

volumes:
  postgres_data:
  uploads_data:

networks:
  finsight_network: